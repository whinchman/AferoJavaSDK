apply plugin: 'java-library'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(path: ':afero-sdk-core')

    // https://github.com/square/retrofit - Updated to latest
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava:2.9.0'
    implementation 'com.squareup.retrofit2:retrofit-mock:2.9.0'

    // https://github.com/square/okhttp - Updated to latest
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // https://github.com/FasterXML/jackson - Updated to latest
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'

    // https://github.com/ReactiveX/RxJava - Updated to latest 1.x version for compatibility
    implementation 'io.reactivex:rxjava:1.3.8'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

publishing {
    publications {
        jar(MavenPublication) {
            version = rootProject.version
            artifactId project.getName()
            groupId rootProject.group

            artifact("$buildDir/libs/${project.getName()}.jar")
//            artifact packageJavadoc

            pom.withXml {
                def dependencies = asNode().appendNode('dependencies')
                configurations.getByName("runtimeClasspath").getResolvedConfiguration().getFirstLevelModuleDependencies().each {
                    // don't include local dependencies
                    if (it.moduleVersion != 'unspecified') {
                        def dependency = dependencies.appendNode('dependency')
                        dependency.appendNode('groupId', it.moduleGroup)
                        dependency.appendNode('artifactId', it.moduleName)
                        dependency.appendNode('version', it.moduleVersion)
                    }
                }
            }
        }
    }
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.links("https://square.github.io/okhttp/4.x/okhttp/")
    options.links("https://square.github.io/retrofit/2.x/retrofit/")
    options.links("https://fasterxml.github.io/jackson-annotations/javadoc/2.15/")
    options.links("https://fasterxml.github.io/jackson-core/javadoc/2.15/")
    options.links("https://fasterxml.github.io/jackson-databind/javadoc/2.15/")
}

task packageJavadoc(type: Jar) {
    from javadoc
    archiveClassifier = 'javadoc'
}
